[package]
name = "tunshell-server"
version = "0.1.0"
authors = ["Elliot Levin <elliotlevin@hotmail.com>"]
edition = "2018"

[dependencies]
tunshell-shared = { path = "../tunshell-shared" }
tokio = { version = "1", features=["rt-multi-thread", "time", "io-util", "net", "macros", "sync"] }
tokio-util = { version = "0.7", features=["compat"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-pki-types = "1"
futures = "0.3.5"
anyhow = "1.0.31"
serde = "1.0.114"
serde_json = "1.0.56"
webpki-roots = "1"
log = "0.4.8"
env_logger = "0.11"
warp = { version = "0.3.3", features=["tls"] }
chrono = "0.4.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rand = "0.10"
rusqlite = { version = "0.40", features=["bundled"] }
uuid = { version = "1", features=["v4"] }

[dev-dependencies]
lazy_static = "1.4.0"
async-tungstenite = { version = "0.8.0", features=["async-tls", "tokio-runtime"] }
async-tls = "0.9.0"
tungstenite = "0.11.0"
