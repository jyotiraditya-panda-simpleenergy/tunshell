[package]
name = "tunshell-client"
version = "0.1.0"
authors = ["Elliot Levin <elliotlevin@hotmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tunshell-shared = { path = "../tunshell-shared" }
anyhow = "1.0.31"
tokio-util = { version = "0.7", features=["compat"] }
futures = "0.3.5"
log = "0.4.8"
env_logger = "0.11"
async-trait = "0.1.33"
twox-hash = "2"
byteorder = "1.3.4"
thiserror = "2"
rand = "0.10"
serde = "1.0.114"
serde_json = "1.0.55"
cfg-if = "0.1.10"

[target.'cfg(all(not(target_os = "ios"), not(target_arch = "wasm32")))'.dependencies]
portable-pty = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features=["rt-multi-thread", "io-util", "io-std", "net", "sync", "process", "macros", "signal", "fs", "time"] } #no-wasm
crossterm = { version = "0.29" }
libc = "0.2.71"
socket2 = "0.6"
async-tungstenite = { version = "0.35", features=["tokio-runtime"] } #no-wasm

[target.'cfg(not(openssl))'.dependencies]
ring = "0.17"
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false }

[target.'cfg(openssl)'.dependencies]
native-tls = "0.2.4"
tokio-native-tls = { version = "0.1.0" }
openssl = { version = "0.10.30", features=["vendored"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "0.2.21", features=["blocking", "time", "io-util", "sync", "macros"] }
wee_alloc = "0.4.5"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.15"
console_error_panic_hook = "0.1.6"
console_log = "0.2.0"
js-sys = "0.3.85"
getrandom = { version = "0.2.6", features=["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.85"
features = [
    "console",
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "Pbkdf2Params",
    "AesDerivedKeyParams",
    "AesGcmParams",
    "BinaryType",
    "Blob",
    "ErrorEvent",
    "FileReader",
    "MessageEvent",
    "ProgressEvent",
    "WebSocket",
]

[target.'cfg(all(unix, not(target_os = "ios"), not(target_os = "android"), not(target_os = "freebsd")))'.dependencies]
remote-pty-common = { git = "https://github.com/TimeToogo/remote-pty" }
remote-pty-master = { git = "https://github.com/TimeToogo/remote-pty" }

[dev-dependencies]
lazy_static = "1.4.0"
